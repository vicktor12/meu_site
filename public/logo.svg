<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 255" width="220" height="255">
  <defs>
    <!-- Clip: brain silhouette (front/coronal view, slightly stylized) -->
    <clipPath id="brain-clip">
      <path d="
        M 110,20
        C 125,15 148,18 164,32
        C 182,47 192,68 191,90
        C 190,113 181,134 166,148
        C 151,162 131,168 110,168
        C 89,168 69,162 54,148
        C 39,134 30,113 29,90
        C 28,68 38,47 56,32
        C 72,18 95,15 110,20 Z
      "/>
    </clipPath>

    <!-- Clip: left half (human side) -->
    <clipPath id="left-clip">
      <rect x="0" y="0" width="110" height="210"/>
    </clipPath>

    <!-- Clip: right half (tech side) -->
    <clipPath id="right-clip">
      <rect x="110" y="0" width="110" height="210"/>
    </clipPath>

    <!-- Subtle gradient for left background -->
    <linearGradient id="bg-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0EAFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>

    <!-- Subtle gradient for right background -->
    <linearGradient id="bg-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#E0EAFF"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════ -->
  <!--  BRAIN INTERIOR (clipped to shape) -->
  <!-- ═══════════════════════════════════ -->
  <g clip-path="url(#brain-clip)">

    <!-- LEFT: Human / Organic side -->
    <g clip-path="url(#left-clip)">
      <!-- Background fill -->
      <rect x="0" y="0" width="110" height="210" fill="url(#bg-left)"/>

      <!-- Organic curves — simplified gyri/sulci arching from midline outward -->
      <!-- Each stroke starts near x=108 and curves left-and-down -->
      <path d="M 107,30  C 88,25  60,36  40,55"
            fill="none" stroke="#1E3A8A" stroke-width="3.5" stroke-linecap="round"/>

      <path d="M 107,50  C 90,44  64,56  46,76"
            fill="none" stroke="#1E40AF" stroke-width="3" stroke-linecap="round"/>

      <path d="M 107,72  C 89,66  65,78  50,100"
            fill="none" stroke="#1E40AF" stroke-width="2.8" stroke-linecap="round"/>

      <path d="M 107,96  C 91,90  70,102  58,122"
            fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>

      <path d="M 107,120 C 93,114  76,126  67,146"
            fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>

      <path d="M 106,146 C 95,140  84,150  80,163"
            fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- RIGHT: Tech / Circuit side -->
    <g clip-path="url(#right-clip)">
      <!-- Background fill -->
      <rect x="110" y="0" width="110" height="210" fill="url(#bg-right)"/>

      <!-- ── CIRCUIT LINES ── -->

      <!-- Horizontal rails -->
      <line x1="110" y1="42"  x2="170" y2="42"  stroke="#1E3A8A" stroke-width="2.5"/>
      <line x1="110" y1="68"  x2="178" y2="68"  stroke="#1E40AF" stroke-width="2.5"/>
      <line x1="110" y1="96"  x2="176" y2="96"  stroke="#2563EB" stroke-width="2"/>
      <line x1="110" y1="122" x2="168" y2="122" stroke="#2563EB" stroke-width="2"/>
      <line x1="110" y1="148" x2="152" y2="148" stroke="#3B82F6" stroke-width="2"/>
      <line x1="110" y1="162" x2="134" y2="162" stroke="#3B82F6" stroke-width="1.5"/>

      <!-- Vertical connectors -->
      <line x1="130" y1="30"  x2="130" y2="68"  stroke="#1E3A8A" stroke-width="2.5"/>
      <line x1="152" y1="30"  x2="152" y2="42"  stroke="#1E3A8A" stroke-width="2.5"/>
      <line x1="152" y1="42"  x2="152" y2="68"  stroke="#1E40AF" stroke-width="2.5"/>
      <line x1="170" y1="42"  x2="170" y2="68"  stroke="#93C5FD" stroke-width="1.8"/>

      <line x1="124" y1="68"  x2="124" y2="96"  stroke="#1E40AF" stroke-width="2.5"/>
      <line x1="148" y1="68"  x2="148" y2="96"  stroke="#1E40AF" stroke-width="2.5"/>
      <line x1="165" y1="68"  x2="165" y2="96"  stroke="#93C5FD" stroke-width="1.8"/>

      <line x1="124" y1="96"  x2="124" y2="122" stroke="#2563EB" stroke-width="2"/>
      <line x1="148" y1="96"  x2="148" y2="122" stroke="#2563EB" stroke-width="2"/>
      <line x1="165" y1="96"  x2="165" y2="122" stroke="#93C5FD" stroke-width="1.5"/>

      <line x1="124" y1="122" x2="124" y2="148" stroke="#3B82F6" stroke-width="2"/>
      <line x1="148" y1="122" x2="148" y2="148" stroke="#3B82F6" stroke-width="1.5"/>

      <line x1="124" y1="148" x2="124" y2="162" stroke="#3B82F6" stroke-width="1.5"/>

      <!-- ── NODES ── (filled circles at junctions) -->
      <!-- Row: y=30 (top starters) -->
      <circle cx="130" cy="30" r="5"   fill="#0B1E3F"/>
      <circle cx="152" cy="30" r="4.5" fill="#1E3A8A"/>

      <!-- Row: y=42 -->
      <circle cx="130" cy="42" r="4.5" fill="#1E3A8A"/>
      <circle cx="152" cy="42" r="4.5" fill="#1E40AF"/>
      <circle cx="170" cy="42" r="3.5" fill="#3B82F6"/>

      <!-- Row: y=68 -->
      <circle cx="124" cy="68" r="4.5" fill="#1E40AF"/>
      <circle cx="148" cy="68" r="4.5" fill="#1E40AF"/>
      <circle cx="165" cy="68" r="3.5" fill="#3B82F6"/>
      <circle cx="170" cy="68" r="3"   fill="#93C5FD"/>

      <!-- Row: y=96 -->
      <circle cx="124" cy="96" r="4"   fill="#2563EB"/>
      <circle cx="148" cy="96" r="4"   fill="#2563EB"/>
      <circle cx="165" cy="96" r="3"   fill="#60A5FA"/>

      <!-- Row: y=122 -->
      <circle cx="124" cy="122" r="4"   fill="#2563EB"/>
      <circle cx="148" cy="122" r="3.5" fill="#3B82F6"/>
      <circle cx="165" cy="122" r="3"   fill="#93C5FD"/>

      <!-- Row: y=148 -->
      <circle cx="124" cy="148" r="4"   fill="#3B82F6"/>
      <circle cx="148" cy="148" r="3"   fill="#60A5FA"/>

      <!-- Row: y=162 -->
      <circle cx="124" cy="162" r="3.5" fill="#60A5FA"/>
    </g>

  </g>

  <!-- ═══════════════════ -->
  <!--  BRAIN OUTLINE     -->
  <!-- ═══════════════════ -->
  <path d="
    M 110,20
    C 125,15 148,18 164,32
    C 182,47 192,68 191,90
    C 190,113 181,134 166,148
    C 151,162 131,168 110,168
    C 89,168 69,162 54,148
    C 39,134 30,113 29,90
    C 28,68 38,47 56,32
    C 72,18 95,15 110,20 Z
  "
  fill="none" stroke="#0B1E3F" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Top "fissure" notch — subtle dip at top center between hemispheres -->
  <path d="M 110,20 C 110,25 110,30 110,38"
        fill="none" stroke="#0B1E3F" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- ═══════════════════════════════ -->
  <!--  CENTER DIVIDING LINE          -->
  <!--  (longitudinal fissure)        -->
  <!-- ═══════════════════════════════ -->
  <line x1="110" y1="20" x2="110" y2="167"
        stroke="#0B1E3F" stroke-width="2"
        stroke-dasharray="5 3.5"
        stroke-linecap="round"
        opacity="0.55"/>

  <!-- ═══════════════════════════════ -->
  <!--  BRAIN STEM (bottom center)    -->
  <!-- ═══════════════════════════════ -->
  <path d="M 96,168 C 94,176 93,185 96,192 C 99,197 110,198 110,198 C 110,198 121,197 124,192 C 127,185 126,176 124,168"
        fill="#E0EAFF" stroke="#0B1E3F" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Stem center line -->
  <line x1="110" y1="170" x2="110" y2="196"
        stroke="#0B1E3F" stroke-width="1.5"
        stroke-dasharray="3.5 2.5"
        stroke-linecap="round"
        opacity="0.4"/>

  <!-- ═══════════════════════ -->
  <!--  LOGOTYPE TEXT         -->
  <!-- ═══════════════════════ -->
  <text
    x="110" y="230"
    text-anchor="middle"
    font-family="Inter, 'Segoe UI', system-ui, sans-serif"
    font-weight="800"
    font-size="26"
    letter-spacing="-0.8"
    fill="#0B1E3F">Brains Tech</text>

  <!-- Subtle tagline (optional — remove if too small at icon sizes) -->
  <text
    x="110" y="248"
    text-anchor="middle"
    font-family="Inter, 'Segoe UI', system-ui, sans-serif"
    font-weight="500"
    font-size="10"
    letter-spacing="2"
    fill="#3B82F6"
    opacity="0.85">SOLUÇÕES EM TI</text>

</svg>
